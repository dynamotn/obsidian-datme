# Type-check, test and build the plugin on every push and pull request, and
# release version tags.
name: CI
on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: |
            main.js
            manifest.json
            styles.css

  # A tag named after the version in manifest.json (Obsidian and BRAT expect
  # `1.2.3`, without a `v`) publishes a GitHub release with the plugin files.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check the tag matches the plugin version
        run: |
          test "$(jq -r .version manifest.json)" = "$GITHUB_REF_NAME"
          test "$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - run: bun run build
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes main.js manifest.json styles.css
        env:
          GH_TOKEN: ${{ github.token }}
